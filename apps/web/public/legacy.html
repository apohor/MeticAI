<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>MeticAI — Live status</title>
    <style>
        /* Intentionally kept to CSS that works back to Safari 11.
           No CSS custom properties, color-mix, nesting, or @property. */
        html, body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                          Helvetica, Arial, sans-serif;
            background: #1a1a1a;
            color: #eaeaea;
            -webkit-text-size-adjust: 100%;
        }
        body { padding: 16px; }
        h1 {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 4px 0;
        }
        .sub {
            color: #9a9a9a;
            font-size: 12px;
            margin-bottom: 16px;
        }
        .card {
            background: #262626;
            border: 1px solid #3a3a3a;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 6px 0;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
        .row:last-child { border-bottom: 0; }
        .row .label { color: #9a9a9a; }
        .row .value {
            font-variant-numeric: tabular-nums;
            font-weight: 500;
        }
        .pill {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
        }
        .pill.on  { background: #1f3f25; color: #8ae29a; }
        .pill.off { background: #3f1f1f; color: #e28a8a; }
        .pill.warn { background: #3f341f; color: #e2c48a; }
        .footer {
            color: #6a6a6a;
            font-size: 11px;
            text-align: center;
            margin-top: 16px;
        }
        a { color: #6aa6ff; }
        .chart-wrap {
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 220px;
            background: #1d1d1d;
            border-radius: 8px;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 16px;
            font-size: 12px;
            margin-top: 8px;
        }
        .legend .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .legend button {
            background: transparent;
            border: 0;
            color: #eaeaea;
            padding: 2px 4px;
            font: inherit;
            cursor: pointer;
        }
        .legend button.off .dot { opacity: 0.25; }
        .legend button.off { color: #6a6a6a; }
    </style>
</head>
<body>
    <h1>MeticAI</h1>
    <div class="sub" id="sub">Live machine status — polling…</div>

    <div class="card">
        <div class="row">
            <span class="label">Connection</span>
            <span class="value" id="v-connected"><span class="pill warn">…</span></span>
        </div>
        <div class="row">
            <span class="label">State</span>
            <span class="value" id="v-state">—</span>
        </div>
        <div class="row">
            <span class="label">Active profile</span>
            <span class="value" id="v-profile">—</span>
        </div>
    </div>

    <div class="card">
        <div class="row">
            <span class="label">Brew head</span>
            <span class="value" id="v-brew">—</span>
        </div>
        <div class="row">
            <span class="label">Boiler</span>
            <span class="value" id="v-boiler">—</span>
        </div>
        <div class="row">
            <span class="label">Target</span>
            <span class="value" id="v-target">—</span>
        </div>
        <div class="row">
            <span class="label">Pressure</span>
            <span class="value" id="v-pressure">—</span>
        </div>
        <div class="row">
            <span class="label">Flow</span>
            <span class="value" id="v-flow">—</span>
        </div>
        <div class="row">
            <span class="label">Weight</span>
            <span class="value" id="v-weight">—</span>
        </div>
    <div class="card">
        <div class="row">
            <span class="label">Shot timer</span>
            <span class="value" id="v-timer">—</span>
        </div>
    </div>

    <div class="card">
        <div class="row" style="border-bottom:0; padding-bottom: 4px;">
            <span class="label">Live shot</span>
            <span class="value" id="v-shot-status">idle</span>
        </div>
        <div class="chart-wrap">
            <canvas id="chart" width="600" height="220"></canvas>
        </div>
        <div class="legend" id="legend"></div>
    </div>

    <div class="footer">
        Safari-15-compatible read-only view. For full controls open the app
        on a device with Safari 16.4 or newer.
    </div>

    <script>
    (function () {
        var FMT_NUM = function (v, suffix, digits) {
            if (v === null || v === undefined || v === '' ) return '—';
            var n = Number(v);
            if (isNaN(n)) return String(v);
            return n.toFixed(digits != null ? digits : 1) + (suffix || '');
        };
        var setText = function (id, text) {
            var el = document.getElementById(id);
            if (el) el.textContent = text;
        };
        var setHTML = function (id, html) {
            var el = document.getElementById(id);
            if (el) el.innerHTML = html;
        };

        // ----- Live chart state ----------------------------------------------
        // Each series stores {t, v} points. 't' is the shot timer in seconds
        // (when brewing) or a wall-clock elapsed value (otherwise).
        var SERIES = [
            { key: 'pressure',             label: 'Pressure (bar)',  color: '#4ea0ff', unit: 'bar',  range: [0, 12],    on: true },
            { key: 'flow_rate',            label: 'Flow (g/s)',      color: '#8ae29a', unit: 'g/s',  range: [0, 8],     on: true },
            { key: 'shot_weight',          label: 'Weight (g)',      color: '#e2c48a', unit: 'g',    range: [0, 60],    on: true },
            { key: 'brew_head_temperature',label: 'Brew head (°C)',  color: '#e28a8a', unit: '°C',   range: [20, 100],  on: true }
        ];
        for (var i = 0; i < SERIES.length; i++) SERIES[i].points = [];

        var lastTimer = null;
        var brewingSince = null;
        var MAX_WINDOW = 60; // seconds of history to show when not in a shot

        function pushSample(snapshot) {
            var brewing = snapshot.brewing === true || snapshot.brewing === 'true';
            var nowSec = Date.now() / 1000;
            var t;
            if (brewing && typeof snapshot.shot_timer === 'number') {
                t = snapshot.shot_timer;
                // If a new shot started (timer reset), clear series.
                if (lastTimer !== null && t + 0.5 < lastTimer) {
                    for (var j = 0; j < SERIES.length; j++) SERIES[j].points.length = 0;
                }
                lastTimer = t;
                brewingSince = nowSec - t;
            } else {
                // Idle — use wall-clock seconds; drop stale > MAX_WINDOW
                t = nowSec;
                lastTimer = null;
            }

            for (var k = 0; k < SERIES.length; k++) {
                var s = SERIES[k];
                var v = snapshot[s.key];
                if (v === null || v === undefined || v === '') continue;
                var num = Number(v);
                if (isNaN(num)) continue;
                s.points.push({ t: t, v: num });
                // Cap memory: keep last 1800 points per series (~3 min @ 10 Hz).
                if (s.points.length > 1800) s.points.splice(0, s.points.length - 1800);
                // Drop idle-view samples outside the sliding window.
                if (!brewing) {
                    var cutoff = nowSec - MAX_WINDOW;
                    while (s.points.length && s.points[0].t < cutoff) s.points.shift();
                }
            }

            setText('v-shot-status', brewing ? 'brewing (live)' : 'idle (last ' + MAX_WINDOW + ' s)');
        }

        function renderLegend() {
            var el = document.getElementById('legend');
            if (!el) return;
            el.innerHTML = '';
            for (var i = 0; i < SERIES.length; i++) {
                (function (s) {
                    var btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = s.on ? '' : 'off';
                    btn.innerHTML = '<span class="dot" style="background:' + s.color + '"></span>' + s.label;
                    btn.onclick = function () {
                        s.on = !s.on;
                        btn.className = s.on ? '' : 'off';
                        drawChart();
                    };
                    el.appendChild(btn);
                })(SERIES[i]);
            }
        }

        var canvas = document.getElementById('chart');
        var ctx = canvas ? canvas.getContext('2d') : null;
        function resizeCanvas() {
            if (!canvas) return;
            var cssW = canvas.clientWidth || 600;
            var cssH = canvas.clientHeight || 220;
            var dpr = window.devicePixelRatio || 1;
            if (canvas.width !== cssW * dpr || canvas.height !== cssH * dpr) {
                canvas.width = cssW * dpr;
                canvas.height = cssH * dpr;
                if (ctx && ctx.setTransform) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
        }

        function drawChart() {
            if (!ctx || !canvas) return;
            resizeCanvas();
            var w = canvas.clientWidth;
            var h = canvas.clientHeight;
            ctx.clearRect(0, 0, w, h);

            // Background grid
            ctx.strokeStyle = '#2c2c2c';
            ctx.lineWidth = 1;
            for (var gy = 1; gy < 4; gy++) {
                var y = (h / 4) * gy;
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
            }
            for (var gx = 1; gx < 6; gx++) {
                var x = (w / 6) * gx;
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
            }

            // Pick an x domain from the union of active series.
            var xMin = Infinity, xMax = -Infinity, anyPoints = false;
            for (var i = 0; i < SERIES.length; i++) {
                var s = SERIES[i];
                if (!s.on || s.points.length === 0) continue;
                anyPoints = true;
                if (s.points[0].t < xMin) xMin = s.points[0].t;
                if (s.points[s.points.length - 1].t > xMax) xMax = s.points[s.points.length - 1].t;
            }
            if (!anyPoints) {
                ctx.fillStyle = '#6a6a6a';
                ctx.font = '12px -apple-system, Helvetica, Arial, sans-serif';
                ctx.fillText('No data yet — pull a shot or wait for telemetry.', 10, 20);
                return;
            }
            if (xMax - xMin < 1) xMax = xMin + 1; // avoid divide-by-zero

            for (var si = 0; si < SERIES.length; si++) {
                var sr = SERIES[si];
                if (!sr.on || sr.points.length < 2) continue;

                // Auto-fit y to actual data, with the configured range as a hint.
                var yMin = sr.range[0], yMax = sr.range[1];
                for (var pi = 0; pi < sr.points.length; pi++) {
                    var pv = sr.points[pi].v;
                    if (pv < yMin) yMin = pv;
                    if (pv > yMax) yMax = pv;
                }
                if (yMax - yMin < 0.5) yMax = yMin + 0.5;

                ctx.strokeStyle = sr.color;
                ctx.lineWidth = 1.75;
                ctx.beginPath();
                for (var p = 0; p < sr.points.length; p++) {
                    var pt = sr.points[p];
                    var px = ((pt.t - xMin) / (xMax - xMin)) * w;
                    var py = h - ((pt.v - yMin) / (yMax - yMin)) * h;
                    if (p === 0) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
                ctx.stroke();
            }

            // X-axis label: show the current window width in seconds.
            ctx.fillStyle = '#6a6a6a';
            ctx.font = '10px -apple-system, Helvetica, Arial, sans-serif';
            ctx.fillText((xMax - xMin).toFixed(1) + ' s window', 6, h - 4);
        }

        renderLegend();
        drawChart();
        window.addEventListener('resize', drawChart);

        var lastOk = 0;

        function tick() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/live/snapshot', true);
            xhr.timeout = 5000;
            xhr.onreadystatechange = function () {
                if (xhr.readyState !== 4) return;
                if (xhr.status !== 200) {
                    setHTML('v-connected', '<span class="pill off">offline</span>');
                    return;
                }
                try {
                    var d = JSON.parse(xhr.responseText) || {};
                    var connected = d.connected === true ||
                                    d.connected === 'true' ||
                                    (d.availability && d.availability !== 'offline');
                    setHTML('v-connected', connected
                        ? '<span class="pill on">online</span>'
                        : '<span class="pill off">offline</span>');
                    setText('v-state', d.state || '—');
                    setText('v-profile', d.active_profile || '—');
                    setText('v-brew',     FMT_NUM(d.brew_head_temperature, ' °C'));
                    setText('v-boiler',   FMT_NUM(d.boiler_temperature,    ' °C'));
                    setText('v-target',   FMT_NUM(d.target_temperature,    ' °C'));
                    setText('v-pressure', FMT_NUM(d.pressure, ' bar', 1));
                    setText('v-flow',     FMT_NUM(d.flow_rate, ' g/s', 1));
                    setText('v-weight',   FMT_NUM(d.shot_weight, ' g', 1));
                    setText('v-timer',    FMT_NUM(d.shot_timer, ' s', 1));

                    pushSample(d);
                    drawChart();

                    lastOk = Date.now();
                    var sub = document.getElementById('sub');
                    if (sub) sub.textContent = 'Live machine status — updated ' +
                        new Date(lastOk).toLocaleTimeString();
                } catch (e) {
                    setHTML('v-connected', '<span class="pill off">error</span>');
                }
            };
            xhr.ontimeout = function () {
                setHTML('v-connected', '<span class="pill off">timeout</span>');
            };
            xhr.send();
        }

        tick();
        // Poll faster so the chart has enough resolution during a shot.
        setInterval(tick, 250);
    }());
    </script>
</body>
</html>
